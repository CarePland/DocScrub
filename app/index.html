         (0.85rem) so each proposal reads as its own object. A lone card
         on a line caps at roughly half the row instead of stretching
         oddly across it -- the max() floor keeps wide headers (PERC) from
         being clipped on narrower windows. */
      .relationship-kind-group { display: flex; flex-wrap: wrap; gap: 0.85rem 1.5rem; margin: 0.35rem 0 1rem; }
      .relationship-kind-group > .relationship-card { flex: 1 1 auto; max-width: max(38rem, calc(50% - 0.75rem)); min-width: 0; }
      .review-workbench > * { min-width: 0; }
      @media (min-width: 1200px) {
        .review-workbench > .workbench-structural,
        .review-workbench > .workbench-main {
          max-height: calc(100vh - var(--workspace-chrome-height, 8rem) - 8rem);
          overflow-y: auto;
          padding-right: 0.25rem;
        }
      }
      @media (max-width: 1199.98px) {
        .review-workbench { grid-template-columns: 1fr; }
      }
      /* Inside the narrower structural column, member cells shrink a step
         so the grid stays a grid. */
      .workbench-structural .relationship-members-grid { grid-template-columns: repeat(auto-fill, minmax(9.5rem, 1fr)); }
      /* MULTI-ITEM MEMBER ROWS (2026-07-30, Andrew): one-per-line member
         rows made the cards visually enormous. Acronym cards (two-ish
         members, varied widths) flow inline on one row; identifier-pattern
         cards (many members, uniform widths by construction -- they share
         a shape signature) use an auto-fill grid, the same cell language
         as Category Check's Results grid, so a dozen numbers read as 2-3
         spreadsheet rows instead of a full-screen column. */
      .relationship-members { gap: 0.35rem; margin-left: 1.4rem; }
      .relationship-members-inline { display: flex; flex-wrap: wrap; }
      .relationship-members-inline > .member-row { flex: 0 1 auto; }
      .relationship-members-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr)); }
      .relationship-members > .member-row { padding: 0.3rem 0.55rem; }
      .relationship-members .member-name { font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

      /* TRIAGE QUEUE (2026-07-30): compact sectioned review grid --
         spreadsheet/email-triage density, not stacked cards. Rows are
         uniform auto-fill cells (the Results-grid cell language); the
         section heading carries the explanation ONCE; an expanded row's
         detail panel spans the grid's full width beneath it. Completed
         rows stay in place, green, minimal. */
      .triage-queue { display: flex; flex-direction: column; gap: 0.9rem; }
      /* CATEGORY-FIRST REVIEW (AG, 2026-08-01, "the category is the
         decision; the items are the evidence"): the category heading is
         the PRIMARY object -- prominent title line with progress and
         Accept All Remaining, one-line conclusion beneath; items are
         supporting evidence. NOTE: this deliberately supersedes the
         same-day "titles recede (muted small-caps)" experiment from the
         parallel workstream -- Andrew's category-first prompt asks for
         the opposite emphasis. A fully-complete category goes green
         (existing completion palette), so the page visibly turns green
         as review progresses and the eye hunts remaining categories. */
      .triage-section-heading { margin-bottom: 0.4rem; }
      /* WRAPPING TITLE LINE (AG, 2026-08-03, taken globally by decision):
         this line was `nowrap`, which meant a heading whose green actions
         outgrew the width compressed its own TITLE and count -- the two
         things that say which section you are looking at and how much of it
         is left. Wrapping instead pushes the overflowing controls to a
         second line and leaves the section's identity at full size. Applied
         to every triage section heading, not just the structural kind
         groups, because "the heading's identity text is the protected side"
         is a property of headings, not of one surface. */
      .triage-section-titleline { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.6rem; }
      .triage-section-title { font-weight: 700; font-size: 1.05rem; }
      .triage-section-count { color: var(--text-muted); font-size: 0.82rem; font-variant-numeric: tabular-nums; }
      .triage-section-explanation { color: var(--text-muted); font-size: 0.85rem; margin-top: 0.05rem; }
      .triage-section-complete .triage-section-title { color: var(--good); }
      .triage-section-complete .triage-section-title::before { content: "✓ "; }
      .triage-section-complete .triage-section-count { color: var(--good); }
      /* Placement REVISED (AG, 2026-08-02, after seeing tiers on the 4K
         canvas): the category action buttons sit INLINE after the
         title/progress cluster, left-aligned -- "right of and inline
         with the title/complete/remaining, with a little spacing" --
         not pushed to the far edge (margin-left:auto retired; on a wide
         window that stranded them a screen-width away from the words
         they act on). First button gets the breathing-room offset; the
         rest follow at the line's own flex gap. */
      .triage-accept-all { margin-left: 0.75rem; font-size: 0.82rem; padding: 0.15rem 0.6rem; border-color: var(--good); color: var(--good); font-weight: 600; }
      .triage-accept-all:hover:not(:disabled) { background: var(--good-soft); }
      .triage-accept-all ~ .triage-accept-all { margin-left: 0; }
      /* SECTION-ACTION DIGITS (AG, 2026-08-02): a numbered section button
         is built by the shared keycapButton, which also carries
         `.preferred-action` -- whose keycap is the blue ACCENT treatment.
         On these green buttons that read as two different vocabularies in
         one control, so the keycap adopts the section-action green. The
         button body already resolves green by source order (this block
         follows `.preferred-action`); this rule finishes the job for the
         key itself, so "green means section-level" stays one signal. */
      .triage-accept-all.preferred-action { color: var(--good); border-color: var(--good); }
      .triage-accept-all.preferred-action .keycap { background: var(--good-soft); border-color: var(--good); }
      /* Tier sub-headings ("Strong Recommendations" / "Needs Review"):
         quieter than the section title -- the section stays the primary
         object; the tier is a shelf within it. Completion reuses the
         section's green vocabulary via the same class. */
      .review-tier-heading { display: flex; align-items: baseline; gap: 0.6rem; margin: 0.55rem 0 0.3rem; }
      .review-tier-title { font-weight: 600; font-size: 0.88rem; color: var(--text-muted); }
      .review-tier-heading.triage-section-complete .review-tier-title { color: var(--good); }
      /* Category-first: items resemble spreadsheet cells, not cards --
         tighter grid, flatter cells. */
      .triage-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(14rem, 1fr)); gap: 0.25rem; }
      .triage-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.3rem; min-width: 0; padding: 0.18rem 0.45rem; border: 1px solid var(--border-soft); border-radius: 3px; background: var(--surface); font-size: 0.92rem; cursor: pointer; transition: background-color 0.3s ease, border-color 0.3s ease; }
      /* Refinement: bare tokens; the state slot is fixed-width so tokens
         column-align whether it shows ✓, ▶, or nothing. Chips inside a
         row shrink a step to keep the grid tight. */
      .triage-state { display: inline-block; min-width: 1em; }
      /* ROW SELECTION (AG, 2026-08-03). The slot is FIXED-WIDTH and present
         on every row, decided or not: `.triage-state` beside it is already
         a fixed-width alignment slot, and rendering the checkbox only on
         undecided rows without reserving its space would shift every
         completed row's token left of its neighbours' -- turning the
         column the ✓/▶ slot exists to create back into a ragged edge.
         `margin: 0` because the UA default on a checkbox is 3px, which is
         enough to break that alignment on its own. */
      .triage-check-slot { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; width: 1.05rem; }
      .triage-check { margin: 0; cursor: pointer; }
      /* The select-all sits left of the heading text, its own column, the
         same relationship the row checkboxes have to their tokens. */
      .triage-select-all { margin: 0 0.1rem 0 0; cursor: pointer; align-self: center; flex-shrink: 0; }
      /* The scope indicator. Accent blue, not a decision hue: a selection
         is a NAVIGATION/intent state -- what you are about to act on --
         never an outcome, and the decision palette is fully allocated. */
      .triage-selected-count { color: var(--accent); font-size: 0.82rem; font-weight: 600; font-variant-numeric: tabular-nums; }
      .triage-row .header-suggestions { font-size: 0.85rem; }
      .triage-row .header-suggestions .preferred-action { padding: 0.1rem 0.45rem; }
      .triage-row-focused { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
      /* UNIFIED DECISION COLOR SYSTEM (AG, 2026-08-03): this used to be a
         flat --good-soft green for ANY decided row, which meant a row the
         reviewer had just REDACTED rendered green -- the single most
         direct contradiction of "the same color always means the same
         thing" anywhere in the app. A done triage row now wears its own
         decision (app.ts adds decisionClass + .decision-tinted), so the
         fill comes from .decision-tinted and this class carries only the
         completion treatment that is genuinely decision-independent. */
      .triage-state { color: var(--text-muted); flex-shrink: 0; }
      .triage-row-done .triage-state { color: var(--decision-hue, var(--text-muted)); font-weight: 700; }
      .triage-token { font-weight: 600; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .triage-accept { font: inherit; font-size: 0.85rem; padding: 0.1rem 0.45rem; border: 1px solid var(--accent); border-radius: 5px; background: var(--surface); color: var(--accent); font-weight: 600; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
      .triage-accept:hover { background: var(--accent-soft); }
      .triage-arrow-done { color: var(--text-muted); font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
      .triage-expand { margin-left: auto; flex-shrink: 0; border: none; background: none; padding: 0 0.15rem; color: var(--text-muted); cursor: pointer; font-size: 0.85rem; }
      .triage-expand:hover { color: var(--accent); }
      /* ══ SIDE-BY-SIDE FOCUS PANE (AG, 2026-08-03) ═══════════════════
         The detail panel used to be a full-width grid child inserted
         beneath its own row, which cut the section's grid in two at
         whatever row happened to be focused. "Making user decisions
         across the entire collection of items is difficult unless they
         are all in the same grid" (AG) -- so the panel takes a column of
         its own and the items keep one unbroken grid beside it. Neither
         region can push the other, so both are spatially stable.

         60/40, not 2/3: the panel comfortably wants more than half, but
         the item column has to stay wide enough for TWO 14rem tracks or
         the grid it exists to preserve collapses to a single file. At a
         ~1300px window a 1/3 item column measures ~25rem (one track);
         2/5 measures ~30rem (two). 60/40 is the widest panel that still
         clears the two-column bar at ordinary laptop widths.

         The 1240px breakpoint is that same bar, solved for the viewport:
         page padding (2rem x2) + stage padding (1rem x2) + this gap take
         ~110px, so two 14rem tracks plus their 0.25rem gutter need about
         (452 / 0.4) + 110 ~= 1240px. BELOW that the split has nothing
         left to preserve -- it would be a one-column strip of items
         beside a panel -- so the regions stack instead and the grid gets
         the full width back. Approximate by construction (chrome heights
         wrap); the failure mode either side is one column of items, not
         a broken layout.

         `minmax(0, …)` on both tracks so a long unbreakable string
         inside the panel cannot blow the column out past its share --
         the default `auto` minimum is min-content, not zero.

         RESPONSIVENESS IS UNTOUCHED, deliberately: `.triage-grid` keeps
         its own `repeat(auto-fill, minmax(14rem, 1fr))` verbatim, so the
         item column re-wraps 2 -> 1 by exactly the mechanism it always
         used, just inside a narrower container -- and because the track
         minimum is unchanged, an individual cell is the SAME WIDTH it
         was before (~238px at 1300px, two-up here vs. five-up
         full-width); there are simply fewer per row. Below the
         breakpoint the two regions stack (DOM order puts the pane on
         top) and the grid gets the full width back, which is the
         pre-change layout with the panel hoisted above the rows. */
      .triage-split { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 0.75rem; align-items: start; }
      @media (max-width: 1239.98px) { .triage-split { grid-template-columns: minmax(0, 1fr); } }
      .triage-focus-pane { display: flex; flex-direction: column; gap: 0.5rem; min-width: 0; }
      /* A grid can hold two open panels at once -- the focused row plus a
         row held open by Space/chevron. Both live here, in row order; the
         gap above is what keeps them legible as two. */
      .triage-expanded { min-width: 0; }

      /* REVIEW SCOPE, Pass 1 (AG, 2026-08-03): the workspace-level
         inspector split -- Item Check's triage view only. Same geometry
         and same breakpoint reasoning as .triage-split above (60/40 is
         the widest inspector that keeps two item columns at ordinary
         laptop widths), but wrapping the WHOLE queue rather than one
         section: the inspector is permanent, so the layout never reflows
         as focus moves. Ambiguity Check keeps .triage-split unchanged. */
      .scope-split { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 0.75rem; align-items: start; }
      @media (max-width: 1239.98px) { .scope-split { grid-template-columns: minmax(0, 1fr); } }
      .scope-inspector { display: flex; flex-direction: column; gap: 0.5rem; min-width: 0; }
      .scope-queue { min-width: 0; }
      .scope-inspector-header { display: flex; align-items: baseline; gap: 0.6rem; }
      .scope-inspector-title { font-weight: 700; font-size: 1.05rem; }
      .scope-inspector-count { color: var(--text-muted); font-size: 0.82rem; font-variant-numeric: tabular-nums; }
      /* One decision opportunity: the queue's own section vocabulary,
         summarized -- quiet card, muted explanation, member tokens as
         plain text chips (never buttons: the ACTIONS live on the section
         headings in the queue, deliberately -- see renderScopeInspector). */
      .scope-section { border: 1px solid var(--border-soft); border-radius: 4px; background: var(--surface); padding: 0.45rem 0.6rem; }
      .scope-section-titleline { display: flex; align-items: baseline; gap: 0.5rem; }
      .scope-section-title { font-weight: 600; font-size: 0.95rem; }
      .scope-section-count { color: var(--text-muted); font-size: 0.82rem; font-variant-numeric: tabular-nums; }
      .scope-section-explanation { color: var(--text-muted); font-size: 0.85rem; margin: 0.15rem 0 0.25rem; }
      .scope-section-members { display: flex; flex-wrap: wrap; gap: 0.25rem; }
      .scope-section-member { font-size: 0.82rem; padding: 0.05rem 0.4rem; border: 1px solid var(--border-soft); border-radius: 3px; color: var(--text-muted); background: var(--surface); }
      .scope-section-member-more { border-style: dashed; }
      .scope-inspector-note { color: var(--text-muted); font-size: 0.85rem; margin: 0; }
      .scope-inspector-footer { display: flex; flex-direction: column; gap: 0.4rem; align-items: flex-start; }
      .scope-inspector-clear { font-size: 0.82rem; }
      /* PARKED CURSOR: position without activation -- the row cursor is
         still HERE (arrows resume from it) but a wider scope is the
         working object, so the full nav-blue activation treatment stands
         down to a dashed outline and the state slot shows ▷ not ▶.
         Precedent: the rows-then-cards seam parks the row cursor the
         same way while the card cursor is the working object. */
      .triage-row-focused.triage-row-parked { box-shadow: none; border-style: dashed; }

      /* 2026-07-30: expanded full view header -- bold name, small (x)
         count. */
      .detail-title { display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.5rem; }
      /* VISUAL HIERARCHY REFINEMENT (AG, 2026-08-01): larger name, smaller
         muted count -- the expanded view leads with the item itself. */
      .detail-title-name { font-weight: 700; font-size: 1.3rem; }
      .detail-title-count { color: var(--text-muted); font-weight: 500; font-size: 0.82rem; }
      /* AG response (2026-07-30): pills share the title line. */
      .detail-title .detail-badges { margin-bottom: 0; }
      /* RECOMMENDATION IS THE ANCHOR (AG, 2026-08-03): the decision bar
         should read "Recommendation -> Decision", not as five equally
         weighted buttons. `align-items: center` vertically centres the
         smaller decision buttons against the taller recommendation chip
         (see .detail-actions .preferred-action below); the slightly wider
         gap after the recommendation group is what separates the two
         halves of that sentence without adding a divider. */
      .detail-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 0.35rem; margin-bottom: 0.6rem; }
      .detail-actions > .header-suggestions { margin-right: 0.35rem; }
      /* The anchor itself: taller and wider than a decision button, so the
         eye lands on what DocScrub recommends before reading the
         alternatives. Deliberately only a SIZE difference -- it already
         carries the accent color and the ① keycap, and adding weight on
         top of those would make it shout rather than lead. */
      .detail-actions .preferred-action { padding: 0.42rem 0.85rem; font-size: 1.02rem; }
      .detail-actions .preferred-action .keycap { font-size: 0.9em; }
      /* .nav-card retired (2026-08-01 stage encapsulation): the
         Navigation section is now the command card's second row. */
      .show-empty-categories { display: inline-flex; align-items: center; gap: 0.35rem; margin-left: auto; color: var(--text-muted); font-size: 0.82rem; }
      .category-cell-empty { opacity: 0.55; }

      /* Review at Scale: search/filter/sort/bulk/command bar (Milestone 2)
         -- styling gap closed in Milestone 3 (these classes existed and
         worked, unstyled, since Milestone 2; folded in here rather than
         left plain now that this file is already getting a CSS pass). */
      .item-check-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; margin-bottom: 0.75rem; padding-bottom: 0.65rem; border-bottom: 1px solid var(--border-soft); }
      .item-check-search-input { font: inherit; padding: 0.32rem 0.55rem; border: 1px solid var(--border); border-radius: 6px; min-width: 14rem; }
      .filter-preset-row { display: flex; flex-wrap: wrap; gap: 0.3rem; }
      .filter-preset-row button { border-radius: 999px; font-size: 0.8rem; }
      .sort-select { font: inherit; padding: 0.3rem 0.5rem; border: 1px solid var(--border); border-radius: 6px; }
      .bulk-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; margin-bottom: 0.65rem; padding: 0.5rem 0.65rem; border: 1px solid var(--accent-soft); border-radius: 6px; background: var(--accent-soft); }
      .bulk-selection-count { font-weight: 600; color: var(--accent); font-size: 0.85rem; }
      /* DYNAMIC COMMAND BAR (2026-07-29): moved from below the stage body to
         above it (app.ts's render()) so it's visible without scrolling,
         matching Andrew's own screenshot reference -- margin adjusted from
         margin-top to margin-bottom accordingly. Its legend text now
         changes with focus context (commandBarLegend() in app.ts) instead
         of being fixed per stage, so the embedded "(k)"/"(n)"/"(r)"/"(i)"/
         "(q)" hints that used to sit on every individual action button
         could be removed -- this one bar is now the single place that
         vocabulary lives. */
      /* STAGE ENCAPSULATION (AG, 2026-08-01): the command area is the
         contained workspace's TOP BAND -- same surface and side borders
         as .stage-body directly beneath, zero gap, so the sticky band
         and the scrolling body read as one object. The command bar is
         now a compact two-section CARD at the band's right ("Current
         Review" vs "Navigation" -- item commands vs application
         movement), each row anchored by a small-caps section label.
         Keycap legend language unchanged (COMMAND-BAR KEYCAPS, same
         day). */
      .workspace-top { display: flex; justify-content: flex-end; padding: 0.45rem 0.6rem; background: var(--surface-canvas); border: 1px solid var(--border); border-bottom: none; border-radius: 8px 8px 0 0; position: relative; z-index: 1; }
      /* COMMAND CARD PLACEMENT (AG, 2026-08-02): the card moved up beside
         the Review Status scores/statistics (the chrome's status row),
         leaving the band as a slim workspace top edge -- the active tab
         still terminates into it, unchanged geometry, just no content. */
      .workspace-top-slim { min-height: 0.55rem; padding: 0; }
      .chrome-status-row { display: flex; align-items: flex-start; gap: 1.25rem; }
      .chrome-status-left { flex: 1 1 auto; min-width: 0; }
      .chrome-status-row > .command-card { flex: 0 1 auto; margin-left: auto; }
      .command-card { display: flex; flex-direction: column; gap: 0.3rem; padding: 0.4rem 0.65rem; background: var(--surface); border: 1px solid var(--border-soft); border-radius: 8px; font-size: 0.82rem; max-width: 100%; }
      .command-card-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 0.3rem 0.65rem; }
      .command-card-label { color: var(--text-muted); font-size: 0.66rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; margin-right: auto; padding-right: 0.7rem; white-space: nowrap; }
      .legend-entry { display: inline-flex; align-items: center; gap: 0.28rem; white-space: nowrap; }
      .legend-label { color: var(--text-muted); }
      .legend-text { color: var(--text-muted); }
      /* Keycaps in the card read as keys: their own surface does the
         separating; text a step darker than the labels so the key is the
         anchor of each pair. */
      .command-card .keycap { color: var(--text); background: var(--surface-muted); }
      .command-bar-selection { font-weight: 600; color: var(--accent); }
      .command-card button { padding: 0.14rem 0.45rem; font-size: 0.8rem; }

      /* INLINE EDITOR REVISION (2026-07-29): replaces window.prompt() for
         Rename/Redact text entry everywhere it appeared (Item Check/
         Ambiguity Check per-candidate, Milestone 2 bulk selection, Not
         Quite per-member) -- an inline input + Confirm/Cancel appended
         right next to the button that opened it, never a separate dialog.
         `.action-editing` marks whichever Rename/Redact button currently
         has its editor open, the same "show which control this belongs to"
         treatment `.group-action-active` already gives an active group
         decision. */
      .inline-editor { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem; flex-basis: 100%; margin-top: 0.3rem; }
      .inline-editor-input { font: inherit; flex: 1 1 auto; min-width: 12rem; padding: 0.3rem 0.55rem; border: 1px solid var(--accent); border-radius: 6px; }
      /* COMPACT VARIANT (AG, 2026-08-03) -- the editor hosted ON a heading's
         title line rather than on a row of its own. Dropping `flex-basis:
         100%` is the whole change: the editor then asks for its content
         width instead of the full line, so the browser -- not a breakpoint,
         not a measurement -- decides inline vs. second line, and re-decides
         on every resize for free.

         WHAT SETS THE THRESHOLD: a flex item never compresses below its
         min-content width, and this one's floor is `.inline-editor-input`'s
         `min-width: 12rem` plus Confirm and Cancel (~22rem). With enough
         room left on the heading it sits beside the green buttons; with
         less, it wraps whole to a second line and `flex-grow: 1` lets it
         fill. The title and count are structurally safe either way, because
         wrapping is always cheaper for the layout engine than crushing
         them. That 12rem is the one knob if the flip point wants tuning. */
      .inline-editor-compact { flex-basis: auto; flex-grow: 1; margin-top: 0; align-self: center; }
      .action-editing { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
      /* Rename quick-pick chips (2026-07-29, Group Check Python-parity
         revision; RESTYLED same day from radio inputs to plain buttons per
         Andrew's direct follow-up: "selectable but not quite buttons. Each
         gets highlighted with focus, encouraging enter" -- selecting one
         submits immediately (see app.ts's renderInlineEditor), so these
         read as lightweight commit actions, not a staged form control.
         Pill-shaped and a size down from the base `button` style ("button
         light") so a row of 2-4 of them plus "Something else…" reads as
         one cohesive choice group, not a wall of full-weight buttons. The
         :focus-visible ring is the "encouraging enter" cue Andrew asked
         for -- Tab or the Left/Right/Up/Down roving-focus keys (app.ts)
         move it between chips. */
      .inline-editor-quick-picks { display: flex; flex-wrap: wrap; gap: 0.4rem; flex-basis: 100%; }
      .inline-editor-quick-pick { border-radius: 999px; padding: 0.28rem 0.75rem; font-size: 0.82rem; }
      .inline-editor-quick-pick:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
      .inline-editor-quick-pick-current { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
      /* Live confidence "was X%" note (2026-07-29, Group Check Python-parity
         revision) -- muted and smaller than the current figure it follows,
         same "informational, not alarming" treatment badges already use. */
      .prior-score { margin-left: 0.35rem; color: var(--text-muted); font-weight: 400; font-size: 0.82em; }
      /* Group Check member checkboxes (2026-07-29, Group Check Python-
         parity revision) -- a way to see a group's member breakdown
         independent of Not Quite. The member list's own expand/collapse
         used to be a manual ▸/▾ toggle; the default-expand revision (same
         day) made expansion follow keyboard focus instead, matching Item/
         Ambiguity Check, and removed the toggle button entirely (see
         app.ts's groupUncheckedMemberIds doc comment for the full history). */
      .group-parent-checkbox { accent-color: var(--accent); }
      /* SPLIT REVIEW MODE (AG, 2026-08-02): the suspended group row --
         greyed, clearly out of play -- and its mode badge; the entry row
         above the member list; the ACTIVE split member carries the focus
         ring the keyboard letters act on. Understated, existing palette. */
      .group-row-suspended { opacity: 0.55; }
      .group-row-suspended .group-row-label { color: var(--text-muted); }
      .split-badge { margin-left: 0.6rem; border: 1px solid var(--border); border-radius: 999px; padding: 0.05rem 0.55rem; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; color: var(--text-muted); background: var(--surface-muted); }
      .separate-these-row { margin: 0.1rem 0 0.35rem; }
      .split-member-row { flex-wrap: wrap; }
      .split-member-row .group-row-actions { margin-left: auto; }
      /* Strengthened (AG live feedback): the cursor member must read as
         THE thing the letters act on -- full nav-blue treatment, not a
         subtle ring. */
      .split-member-active { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 2px var(--accent); }
      .group-members { display: flex; flex-direction: column; gap: 0.3rem; margin: 0.3rem 0 0.6rem 1.9rem; }
      .member-row { display: flex; align-items: center; gap: 0.5rem; padding: 0.35rem 0.55rem; border: 1px solid var(--border-soft); border-radius: 6px; background: var(--surface); }
      /* 2026-07-30 follow-up: entering an item with Down highlights the
         selected member ROW (not just its focused control) -- the roving
         grid moves real DOM focus, so :focus-within is the row-level cue. */
      .member-row:focus-within { border-color: var(--accent); background: var(--accent-soft); }
      /* VISUAL HIERARCHY REFINEMENT (AG, 2026-08-01): member names join
         the primary-text tier too -- every cell leads with its text. */
      .member-name { flex: 1 1 auto; font-weight: 600; font-size: 1rem; }

      /* Group Check revision (2026-07-29) -- compact, color-coded rows and
         a working sort + 2-column layout, replacing the plain unstyled
         Group Check rows that predated this pass. Muted backgrounds on the
         row itself (calm, scannable at a glance, never louder than the
         rest of the workspace); the one currently-active decision button
         gets the SOLID, "emphatic but not aggressive" version of the same
         hue -- reusing --caution's already-muted brick-red for Redact
         rather than a harsher alarm red, per Andrew's own "emphatic, not
         aggressive" instruction. */
      .group-check-toolbar { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.75rem; }
      .group-sort-label { color: var(--text-muted); font-size: 0.85rem; }
      /* 2026-07-30 feature spec: two columns arrive AUTOMATICALLY above a
         window-width threshold (the manual toggle is gone). Row-major
         auto-flow means DOM order reads across each row before moving
         down, so Tab/advance order is the spec's "peruse a horizontal row
         completely before moving to the next row" with zero JS. Each
         .group-cell holds one group's row + member breakdown, so an
         expanded group stays inside its own column; a Fix this panel
         (.group-cell-wide) spans both. */
      .group-list { display: flex; flex-direction: column; gap: 0.4rem; }
      .group-cell { display: flex; flex-direction: column; gap: 0.4rem; align-self: start; }
      @media (min-width: 1280px) {
        .group-list { display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem; align-items: start; }
        .group-cell-wide { grid-column: 1 / -1; }
      }
      /* VISUAL HIERARCHY REFINEMENT (AG, 2026-08-01): the name is the row.
         Counts (and the "n of m selected" note) sit beside it small and
         muted -- same primary/secondary split as the result cells. */
      .group-row-label { font-weight: 700; font-size: 1.12rem; }
      .row-count { color: var(--text-muted); font-weight: 500; font-size: 0.78rem; }
      .item-row-title { font-weight: 600; font-size: 1.05rem; }
      .item-row-meta { color: var(--text-muted); font-weight: 400; font-size: 0.8rem; }
      /* AG response (2026-07-30): percentages and circled checks sit
         directly LEFT of the action buttons, right-aligned -- so they form
         a scannable vertical column across rows (the Python template's
         arrangement). The confidence/check carries the margin-left:auto;
         the buttons follow it. */
      .group-row-actions { display: flex; flex-wrap: wrap; gap: 0.35rem; }
      .item-row > .row-confidence, .item-row > .reviewed-check, .group-row > .confidence-plain,
      .member-row > .confidence-plain, .member-row > .reviewed-check { margin-left: auto; margin-right: 0.35rem; }

      /* ══ UNIFIED DECISION COLOR SYSTEM (AG, 2026-08-03) ══════════════
         Color represents review DECISIONS, not review stages: the same
         hue means the same thing in Ambiguity Check, Group Check, Item
         Check, Type Check and QA, so a reviewer never relearns the
         palette when moving between them.

         This block replaced ~24 hand-enumerated rules (.group-row-<kind>,
         .item-row-focused.group-row-<kind>, .group-cell-<kind>,
         .group-action-active.group-row-<kind>) that differed only in
         which decision and which SURFACE they painted. Those two axes are
         now separated: a DECISION class below supplies four custom
         properties, and a SURFACE class decides what to do with them.
         Adding a fifth decision is one line here, not six edits.

         PRECEDENCE (Redact > Change > Keep > Ignore) is not expressed in
         CSS at all -- it is a statement about decisions rather than
         pixels, so it lives in src/domain/DecisionPrecedence.ts where the
         engine can share it. CSS only ever paints the single dominant
         decision the summary already picked. */
      .decision-keep { --decision-hue: var(--good); --decision-tint: var(--good-soft); --decision-tint-contrast: #dcefe3; --decision-border: #bfe3cc; }
      .decision-rename { --decision-hue: var(--rename); --decision-tint: var(--rename-soft); --decision-tint-contrast: #dee5f7; --decision-border: #c3cdf0; }
      .decision-redact { --decision-hue: var(--caution); --decision-tint: var(--caution-soft); --decision-tint-contrast: #f6dfe2; --decision-border: #eec1c4; }
      .decision-ignore { --decision-hue: var(--ignore-color); --decision-tint: var(--ignore-soft); --decision-tint-contrast: #e9def4; --decision-border: #d7c3ea; }

      /* NON-DECISION SCHEMES feed the same cascade so containment works
         identically, but are deliberately OUTSIDE the decision palette --
         being a different family is precisely what makes them legible as
         "a mode you are in" rather than "an outcome you chose."
         .scheme-nav: the focused-but-undecided item. .scheme-fixthis: an
         OPEN Fix this session (amber). Amber now means ONLY this -- it
         used to also carry mixed-decision "needs attention" on cards,
         which the dominant-tint + pills model replaced (2026-08-03), and
         a confidence band, which moved to depth-of-ink. One hue, one
         meaning. The solid GRAY Fix this button emphasis on already-fixed
         mixed groups is a different, committed state and stays gray. */
      .scheme-nav { --decision-hue: var(--accent); --decision-tint: var(--accent-soft); --decision-tint-contrast: #d9e6f8; --decision-border: var(--accent); }
      .scheme-fixthis { --decision-hue: var(--warn); --decision-tint: var(--warn-soft); --decision-tint-contrast: #f6e7c8; --decision-border: #efd9ab; }

      /* SURFACE: a filled element wearing its decision. The one rule that
         replaced the four .group-row-<kind> rules AND the four
         .item-row-focused.group-row-<kind> continuity overrides -- the
         latter are unnecessary now that focus is a ring and never touches
         the fill channel (see .item-row-focused above). */
      .decision-tinted { border-color: var(--decision-border); background: var(--decision-tint); }

      /* ITEM-SCHEME CASCADE (AG, 2026-07-30, retained): the item's
         containing color flows to every inline derived area so "the item
         always feels contained by the color." Members take the soft tint;
         the Source panel and the selected member take a slightly
         CONTRASTING shade of the same hue (never accent blue inside a
         decided item). Renamed from --item-* to --decision-* so one
         vocabulary covers both the container and the surfaces it feeds. */
      .item-schemed .not-quite-panel { background: var(--decision-tint); border-color: var(--decision-tint-contrast); }
      .item-schemed .not-quite-panel .item-row.item-row-focused { background: var(--decision-tint-contrast); border-color: var(--decision-hue); }
      .item-schemed .not-quite-panel .source-panel { background: var(--decision-tint-contrast); border-color: var(--decision-hue); }
      .item-schemed .member-row { background: var(--decision-tint); border-color: var(--decision-tint-contrast); }
      .item-schemed .member-row:focus-within { background: var(--decision-tint-contrast); border-color: var(--decision-hue); }
      .item-schemed .source-panel { background: var(--decision-tint-contrast); border-color: var(--decision-hue); }
      /* CONTEXTUAL MEMBER DECISIONS (AG, 2026-07-30): a member's or
         focused row's OWN pending Change/Redact editor outranks the
         item's containment scheme on that one row -- same precedence as
         everywhere. Two rules now instead of four: each reads
         --decision-tint from the row's own decision class, which shadows
         the container's value on that element. */
      .item-schemed .not-quite-panel .item-row.item-row-focused.decision-tinted { background: var(--decision-tint); border-color: var(--decision-hue); }
      .item-schemed .member-row.member-pending.decision-tinted { background: var(--decision-tint); border-color: var(--decision-hue); }

      /* SURFACE: solid emphasis on the currently-active bulk action
         button. Five rules collapsed to two -- the button already wears a
         decision class, so it already has --decision-hue; Fix this simply
         supplies its own gray into the same slot ("Not Quite: same but
         gray", 2026-07-30 feature spec). */
      .group-action-active { font-weight: 700; background: var(--decision-hue, var(--accent)); border-color: var(--decision-hue, var(--accent)); color: #fff; }
      .group-action-notquite { --decision-hue: var(--notquite); }

      /* SURFACE: decision pills. The card's tint speaks its DOMINANT
         decision; these speak every ADDITIONAL decision it contains, in
         the same precedence order, so a card with one decision shows no
         pills at all and any pill means "more than one thing happened
         here." The letter (K/C/R/I) is not decoration -- it is what keeps
         the signal readable for a red-green colorblind reviewer, for whom
         these tints are near-identical. See ui/decisionLabels.ts. */
      .decision-pills { display: inline-flex; align-items: center; gap: 0.2rem; }
      .item-row > .decision-pills { margin-left: auto; }
      .decision-pill { display: inline-flex; align-items: center; justify-content: center; min-width: 1.1rem; height: 1.1rem; padding: 0 0.22rem; border: 1px solid var(--decision-hue); border-radius: 999px; background: var(--decision-tint); color: var(--decision-hue); font-size: 0.66rem; font-weight: 700; line-height: 1; }
      .jump-category-select { font: inherit; padding: 0.2rem 0.4rem; border: 1px solid var(--border); border-radius: 6px; }

      /* Reviewer Productivity (Milestone 3) */
      /* .persistence-status retired (2026-08-01): save state lives in the
         header's permanent .app-save-status slot now. */
      /* Toolbar primary actions (New Document / Resume): the annotated
         reference shows these as solid accent buttons -- the two actions
         a reviewer starts from. */
      .primary-action { background: var(--accent); border-color: var(--accent); color: #fff; }
      .primary-action:hover:not(:disabled) { background: #1e4a91; border-color: #1e4a91; }
      .recent-documents { margin-top: 1rem; }
      .recent-documents-list { display: flex; flex-direction: column; gap: 0.4rem; margin-top: 0.5rem; }
      .recent-document-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem; padding: 0.5rem 0.65rem; border: 1px solid var(--border-soft); border-radius: 6px; background: var(--surface); }
      .recent-document-name { font-weight: 600; }
      .recent-document-meta { color: var(--text-muted); font-size: 0.82rem; flex: 1 0 auto; }
      .review-stats { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.9rem; margin: 0.15rem 0 0.75rem; font-size: 0.85rem; color: var(--text-muted); }
      .review-stats-item { white-space: nowrap; }
      .review-stats-by-type summary { cursor: pointer; }
      .redaction-rules-panel { margin-bottom: 0.9rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--border-soft); }
      .redaction-rules-panel > summary { cursor: pointer; font-weight: 600; }
      /* REDACTION RULES, PYTHON LAYOUT (AG, 2026-08-01): one bordered row
         per entity type -- bold type name, Apply to all / Sequential
         radio pair, a labelled Replacement Text input, an inline
         "Preview:" of the resulting placeholder, and an italic
         "autosaves" note at the right edge (the change commits on
         blur/Enter with no Save button, so the note says so). The
         Advanced checkbox beside the summary swaps the radios for the
         raw strategy select + custom {n} template. */
      .redaction-rules-header { display: inline-flex; align-items: center; gap: 0.8rem; }
      .redaction-rules-advanced { display: inline-flex; align-items: center; gap: 0.3rem; color: var(--text-muted); font-size: 0.82rem; font-weight: 400; }
      .redaction-rule-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1.1rem; margin: 0; padding: 0.55rem 0.2rem; border-bottom: 1px solid var(--border-soft); }
      .redaction-rule-type { min-width: 7.5rem; font-weight: 700; font-size: 1.02rem; }
      .redaction-rule-modes { display: inline-flex; align-items: center; gap: 0.9rem; }
      .redaction-rule-mode { display: inline-flex; align-items: center; gap: 0.3rem; font-weight: 600; font-size: 0.88rem; cursor: pointer; }
      .redaction-rule-mode input { accent-color: var(--accent); }
      .redaction-rule-text { display: inline-flex; flex-direction: column; gap: 0.1rem; }
      .redaction-rule-text-label { color: var(--text-muted); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.02em; text-transform: uppercase; }
      .redaction-rule-input { font: inherit; padding: 0.28rem 0.55rem; border: 1px solid var(--border); border-radius: 6px; min-width: 13rem; }
      .redaction-rule-preview { color: var(--text-muted); font-size: 0.85rem; }
      .redaction-rule-autosaves { margin-left: auto; color: var(--text-muted); font-style: italic; font-size: 0.8rem; }
      .redaction-rules-preview { margin-top: 0.5rem; }

      @media (max-width: 900px) {
        .expert-grid { grid-template-columns: 1fr; }
      }

      /* INTERACTION LANGUAGE (2026-07-30, keyboard UX refinement).
         .chip-nav-cursor -- the Shift+Arrow cursor ring on the narrowing
         column's header rows: rendered on the ACTIVE chip of whichever row
         the cursor is on (position IS selection within a single-select
         row), so vertical travel between rows is always visibly anchored
         (see app.ts's filterHeaderRow).
         .result-cell-selected -- X-key selection membership on the tight
         Results cells, which deliberately carry no checkbox (the grid's
         only selection affordance is the keyboard).
         :focus-visible -- Chrome-mode and detail-panel traversal move real
         DOM focus through controls that historically only ever saw mouse
         clicks; the keyboard path needs a visible ring the mouse path
         doesn't draw. */
      .chip-nav-cursor { outline: 2px solid var(--accent); outline-offset: 2px; }
      .result-cell-selected { box-shadow: inset 0 0 0 2px var(--accent); }
      .workspace-chrome :focus-visible, .keyboard-region :focus-visible, .top-bar :focus-visible, .detail-panel :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

      /* RX-18 (2026-07-29): persistent status region -- a calm, fixed bar
         along the bottom edge (the conventional home for ambient status),
         visually part of the application chrome without competing with the
         sticky top chrome for vertical space. pointer-events: none -- it
         is read-only furniture, never an interaction target; :empty hides
         it entirely until the first message so a fresh session shows no
         hollow strip. Fixed overlay: appearing/disappearing never shifts
         layout (body's existing 3rem bottom padding keeps the last row
         clear of it). */
      .status-region { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 0.35rem 2rem; font-size: 0.82rem; color: var(--text-muted); background: var(--surface); border-top: 1px solid var(--border-soft); pointer-events: none; }
      .status-region:empty { display: none; }

      /* RX-09 (2026-07-29): transient toast for recoverable failures --
         top-right overlay, ~1.3s visible (TOAST_VISIBLE_MS in app.ts) with
         a CSS fade, never inserted flow content. Caution styling, not
         alarm-red: these are "that didn't work" moments, not emergencies
         (action-required failures get the persistent inline banner
         instead). pointer-events: none so a fading toast never blocks a
         click on whatever sits beneath it. */
      .toast-host { position: fixed; top: 0.75rem; right: 1rem; z-index: 40; max-width: 24rem; padding: 0.5rem 0.8rem; border: 1px solid #eec1c4; border-radius: 8px; background: var(--caution-soft); color: var(--caution); font-size: 0.85rem; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity 0.25s ease; }
      .toast-host.toast-visible { opacity: 1; }

      /* RX-26 (Wave 2 rider, 2026-07-29): with RX-14 landed, the pulse +
         colour change + "✓ Saved" badge fire on EVERY decision -- the most
         frequent action in the app. The colour and badge carry the meaning
         unaided, so reviewers who ask the OS for reduced motion lose
         nothing but the animation. */
      @media (prefers-reduced-motion: reduce) {
        .row-acknowledged-pulse { animation: none; }
      }

      /* Workspace Analysis (standalone subsystem, src/workspace-analysis/).
         Scoped entirely under .wsa- so it can be styled and changed without
         touching any rule above -- the CSS-side mirror of that subsystem's
         file/type/state independence from the review pipeline. Reuses the
         SAME palette variables as the rest of the app (no new hues) so the
         page reads as part of DocScrub, not a bolted-on tool, even though
         no rule here depends on anything above it. */
      .wsa-page { max-width: 52rem; }
      .wsa-header h2 { margin: 0 0 0.2rem; }
      .wsa-subtitle { margin: 0 0 1rem; color: var(--text-muted); font-size: 0.9rem; max-width: 40rem; }
      .wsa-import-controls { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; padding: 0.75rem 0.9rem; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
      .wsa-file-label { display: flex; align-items: center; gap: 0.5rem; font-weight: 600; font-size: 0.88rem; color: var(--text); }
      .wsa-status { color: var(--text-muted); }
      .wsa-status-error { color: var(--caution); font-weight: 600; }
      .wsa-feedback { margin: 0 0 0.75rem; padding: 0.5rem 0.7rem; border-radius: 6px; font-size: 0.85rem; }
      .wsa-feedback-error { background: var(--caution-soft); color: var(--caution); border: 1px solid #eec1c4; }
      .wsa-feedback-info { background: var(--accent-soft); color: var(--accent); border: 1px solid var(--border); }
      .wsa-summary { color: var(--text-muted); font-size: 0.88rem; margin: 0 0 1rem; }
      .wsa-groupings h3 { margin: 1.1rem 0 0.5rem; font-size: 0.95rem; }
      .wsa-empty-note { color: var(--text-muted); font-size: 0.88rem; }
      .wsa-grouping-card { margin-bottom: 0.7rem; padding: 0.65rem 0.8rem; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
      .wsa-grouping-card.wsa-status-accepted { border-color: var(--good); background: var(--good-soft); }
      .wsa-grouping-card.wsa-status-merged { border-color: var(--accent); }
      .wsa-grouping-header { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; margin-bottom: 0.35rem; }
      .wsa-grouping-strength { font-weight: 600; font-size: 0.85rem; color: var(--text); }
      .wsa-grouping-status-badge { display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: 999px; padding: 0.05rem 0.55rem; font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.02em; color: var(--text-muted); background: var(--surface-muted); }
      .wsa-grouping-members { list-style: none; margin: 0 0 0.4rem; padding: 0; display: flex; flex-direction: column; gap: 0.15rem; }
      .wsa-member-item { display: flex; align-items: center; gap: 0.4rem; font-size: 0.88rem; color: var(--text); }
      .wsa-evidence-list { margin: 0 0 0.5rem; padding-left: 1.2rem; color: var(--text-muted); font-size: 0.82rem; }
      .wsa-evidence-item { margin-bottom: 0.1rem; }
      .wsa-grouping-actions { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
      .wsa-merge-select { font: inherit; padding: 0.2rem 0.4rem; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); max-width: 16rem; }
      .wsa-unrelated-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.2rem; }
      .wsa-unrelated-item { padding: 0.35rem 0.6rem; border: 1px solid var(--border-soft); border-radius: 6px; background: var(--surface); color: var(--text-muted); font-size: 0.88rem; }
    </style>
  </head>
  <body>
    <!-- APPLICATION FRAME REFINEMENT (AG, 2026-08-01): the header is the
         permanent application frame -- sticky, answering "what am I
         working on / is my work saved / what can I do" before the
         workspace begins. Static markup outside #app (the .app-version
         precedent: render() clears #app.innerHTML), with the dynamic
         slots (.app-document-title, .app-document-panel,
         .app-save-status) written by app.ts's syncAppHeader() on every
         render rather than rebuilt. The old subtitle line (an
         implementation pointer, not reviewer information) is gone. -->
    <div class="app-header">
      <div class="app-header-left">
        <img class="app-logo" src="assets/docscrub.png" alt="DocScrub" height="28" />
        <span class="app-version" title="See docs/architecture/design-notes.md for what changed in this version"></span>
      </div>
      <div class="app-document">
        <span class="app-document-title"></span>
        <div class="app-document-panel" hidden></div>
      </div>
      <div class="app-header-right">
        <span class="app-save-status"></span>
        <button class="app-settings-button" type="button" title="Settings" aria-label="Settings" aria-haspopup="menu">⚙</button>
        <div class="app-settings-menu" role="menu" hidden>
          <!-- WORKSPACE METRICS (AG, 2026-08-02): read-only telemetry for
               the active workspace in a separate window -- wired in
               app.ts's one-time header block. -->
          <button class="app-settings-item app-settings-metrics" role="menuitem" type="button">Workspace Metrics</button>
          <div class="app-settings-item app-settings-item-disabled" role="menuitem" aria-disabled="true">Preferences</div>
          <div class="app-settings-item app-settings-item-disabled" role="menuitem" aria-disabled="true">User account</div>
          <div class="app-settings-item app-settings-item-disabled" role="menuitem" aria-disabled="true">DocScrub Vault</div>
          <div class="app-settings-item app-settings-item-disabled" role="menuitem" aria-disabled="true">Licensing</div>
          <div class="app-settings-item app-settings-item-disabled" role="menuitem" aria-disabled="true">Updates</div>
          <!-- PREVIEW GATE (AG, 2026-08-01): the one interactive item for
               now -- clears the preview-session flag and returns to the
               access screen (wired in previewGate.ts, not app.ts). -->
          <button class="app-settings-item app-settings-exit-preview" type="button" role="menuitem">Exit Preview</button>
          <div class="app-settings-item app-settings-about" role="menuitem"></div>
        </div>
      </div>
    </div>
    <div id="app"></div>
    <!-- RX-18 / RX-09 (Reviewer Experience Wave 2, 2026-07-29): the two
         notification hosts live in STATIC markup outside #app, following
         .app-version's established pattern, because render() clears
         #app.innerHTML on every state change (including background
         autosave renders) -- a message inside #app would vanish
         non-deterministically within milliseconds. Static hosts also work
         from the landing view, where render() returns before any workspace
         chrome exists and where the most probable first error of a session
         (a document load/resume failure) actually fires. app.ts writes
         them via setStatus()/notifyToast(); render() never creates,
         clears, or writes them.

         .status-region is the app's persistent, non-blocking channel for
         refusals, results, and narration ("latest message only, not a
         log") -- and, with role="status"/aria-live, this application's
         first accessibility primitive: one element, one writer,
         aria-atomic, so later screen-reader work extends it rather than
         replacing it. The toast host is aria-hidden: every toast text is
         ALSO written to the status region, so announcing both would
         double-speak. Both are fixed overlays -- notifications never
         shift page layout. -->
    <div class="status-region" role="status" aria-live="polite" aria-atomic="true"></div>
    <div class="toast-host" aria-hidden="true"></div>
    <!-- PREVIEW GATE (AG, 2026-08-01): a TEMPORARY shared-password access
         screen, the visual foundation of a future login. All behavior
         lives in previewGate.ts (the module below), which defers the
         application module's import until access is granted -- app.ts
         knows nothing about the gate. See previewGate.ts's doc comment
         for the replacement seam and the deliberate scope restraint. -->
    <div class="preview-gate" hidden>
      <div class="preview-gate-card">
        <div class="preview-gate-brand">
          <img class="app-logo" src="assets/docscrub.png" alt="DocScrub" height="30" />
          <span class="preview-badge">Private Preview</span>
        </div>
        <h1 class="preview-gate-heading">DocScrub Preview</h1>
        <p class="preview-gate-supporting">Individual accounts are not yet enabled. Enter the shared preview password to continue.</p>
        <!-- onsubmit="return false" (2026-08-02): a MARKUP-LEVEL hard stop
             on native form submission. Root cause of "type password, press
             Enter, dots disappear": in some page states (observed live)
             the module's submit handler wasn't attached, so Enter fell
             through to a NATIVE GET submit -- the page navigated to
             index.html?, wiping the field and re-showing a fresh gate,
             indistinguishable from rejection. The inline attribute exists
             the instant the form exists, needs no module, and cannot be
             lost to any script race: the module's listener still handles
             the real submit; native navigation is simply impossible. -->
        <form class="preview-gate-form" onsubmit="return false">
          <label class="preview-field">
            <span class="preview-field-label">Email</span>
            <input type="text" value="Preview account" disabled />
          </label>
          <label class="preview-field">
            <span class="preview-field-label">Password</span>
            <!-- SHARED preview password, not a personal credential
                 (2026-08-02, root cause of "the password does not work!"):
                 autocomplete="current-password" INVITED password managers
                 to attach, and 1Password's inline overlay was capturing
                 the user's keystrokes -- typing went into its search box,
                 Enter searched the vault, and the page never received a
                 single key. The opt-outs below tell 1Password/LastPass/
                 Dashlane to stand down; re-invite managers only when this
                 becomes a real per-user login. -->
            <input type="password" class="preview-password" autocomplete="off" data-1p-ignore data-lpignore="true" data-form-type="other" autofocus />
          </label>
          <p class="preview-gate-error" hidden>Incorrect preview password.</p>
          <button type="submit" class="primary-action preview-submit">Enter DocScrub</button>
        </form>
      </div>
    </div>
    <!-- Supabase config: browser-safe project URL + publishable key only.
         env-config.js is gitignored; env-config.example.js is the checked-in
         template. Must run before the module graph below. -->
    <script src="./env-config.js"></script>
    <!-- No bundler in this app (see README.md, "no framework, no bundler").
         This import map lets src/lib/supabase.ts's bare `@supabase/supabase-js`
         specifier resolve natively in the browser via a pinned CDN build,
         while the same specifier resolves through node_modules for `tsc`
         type-checking (package.json). Bump both together. -->
    <script type="importmap">
      {
        "imports": {
          "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.112.1"
        }
      }
    </script>
    <script type="module" src="./dist/ui/previewGate.js"></script>
  </body>
</html>
