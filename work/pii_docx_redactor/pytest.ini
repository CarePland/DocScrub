[pytest]
# Makes `redactor` importable from tests/ regardless of invocation directory.
#
# Why this is needed: tests/ has no __init__.py, so pytest's default
# "prepend" import mode inserts tests/ itself onto sys.path when collecting
# a test module -- not this directory (pii_docx_redactor/, the parent that
# actually contains the `redactor` package). Without this file, `pytest` run
# from anywhere raised "ModuleNotFoundError: No module named 'redactor'"
# even when invoked with this directory as cwd, because nothing was ever
# adding this directory to sys.path -- historical invocations that worked
# most likely did so via `python -m pytest` (which prepends cwd) or an IDE
# test runner that sets PYTHONPATH itself, not because of anything pytest
# does by default.
#
# `pythonpath` is a built-in pytest option (>=7.0; this repo pins pytest>=8.0
# in requirements.txt) that explicitly adds the given path(s), relative to
# this file's directory, to sys.path for the test session. This is additive
# test-configuration only -- it does not change any application behavior in
# redactor/ or local_web_app.py.
pythonpath = .
testpaths = tests
